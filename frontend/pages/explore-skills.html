<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Skills – SkillSync</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/skills.css">
</head>
<body>
  <div class="app-layout" id="app"></div>
  <script src="/js/skill-icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    if (!initAuthPage()) throw new Error('Not authenticated');
    const categories = ['All', 'Programming', 'Design', 'Data', 'Business', 'Creative', 'Communication', 'Science', 'Languages'];
    let currentCategory = 'All';
    let searchQuery = '';

    function render() {
      document.getElementById('app').innerHTML = renderAuthenticatedLayout('Explore Skills', 'explore', `
        <div class="page-header"><h1>Explore Skills</h1><p>Discover skills to learn or teach. Find the perfect match for your interests.</p></div>
        <div class="skills-toolbar">
          <div class="search-box"><span class="search-icon">🔍</span><input type="text" placeholder="Search skills..." id="skillSearch" value="${searchQuery}" oninput="handleSearch(this.value)"></div>
          <div class="category-filters">${categories.map(c => `<button class="category-filter ${currentCategory===c?'active':''}" onclick="filterCategory('${c}')">${c}</button>`).join('')}</div>
        </div>
        <div class="skills-grid" id="skillsGrid">${renderSkeletonCards(8)}</div>
      `);
      loadSkills();
    }

    const handleSearch = debounce((val) => { searchQuery = val; loadSkills(); }, 300);

    function filterCategory(cat) { currentCategory = cat; render(); }

    async function loadSkills() {
      try {
        const params = new URLSearchParams();
        if (currentCategory !== 'All') params.append('category', currentCategory);
        if (searchQuery) params.append('search', searchQuery);
        const data = await api.get(`/skills?${params}`);
        const grid = document.getElementById('skillsGrid');
        if (data.skills.length === 0) {
          grid.innerHTML = renderEmptyState('🔍', 'No Skills Found', 'Try a different search or category.', '', '');
          return;
        }
        grid.innerHTML = data.skills.map(s => `
          <div class="skill-card" onclick="window.location.href='/pages/skill-details.html?id=${s._id}'">
            <div class="skill-card-header">
              <div class="skill-icon-box">${SkillIcons.getIcon(s.name, 36)}</div>
              <div class="skill-meta">
                <h3>${s.name}</h3>
                <span class="skill-category">${s.category}</span>
              </div>
            </div>
            <div class="skill-stats">
              <div class="skill-stat"><strong>${s.learnerCount || 0}</strong> learners</div>
              <div class="skill-stat"><strong>${s.difficulty}</strong></div>
            </div>
            <div class="skill-footer">
              <span class="chip chip-primary">${s.category}</span>
              <span class="btn btn-sm btn-outline">View Skill</span>
            </div>
          </div>
        `).join('');
      } catch(e) { Toast.error('Failed to load skills'); }
    }

    render();
  </script>
</body>
</html>
