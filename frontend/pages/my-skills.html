<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Skills – SkillSync</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/skills.css">
</head>
<body>
  <div class="app-layout" id="app"></div>

  <!-- Add Skill Modal -->
  <div class="modal-overlay" id="addSkillModal">
    <div class="modal" style="max-width: 580px;">
      <div class="modal-header">
        <h3>Add Skills</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="skillType">Skill Type</label>
          <select class="form-select" id="skillType" onchange="onSkillTypeChange()">
            <option value="teach">I Can Teach</option>
            <option value="learn">I Want to Learn</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="skillSearchInput">Search & Select Skills</label>
          <div class="skill-searchable-select" id="skillSearchableSelect">
            <div class="skill-select-input-wrap">
              <span class="skill-select-icon">🔍</span>
              <input 
                type="text" 
                id="skillSearchInput" 
                class="form-input skill-search-input" 
                placeholder="Search skills (e.g. Python, Figma, Video Editing)..." 
                autocomplete="off"
                spellcheck="false"
                onfocus="openSkillDropdown()"
                oninput="handleSkillSearch(this.value)"
                onkeydown="handleSkillKeyDown(event)"
              >
              <button type="button" class="skill-select-clear" id="skillClearBtn" style="display:none;" title="Clear search" onclick="clearSearchInput(event)">✕</button>
              <span class="skill-select-arrow" id="skillDropdownArrow" onclick="toggleSkillDropdown(event)">▼</span>
            </div>
            <div class="skill-dropdown-menu" id="skillDropdownMenu" role="listbox">
              <div class="skill-dropdown-status" id="dropdownStatus">Loading skills...</div>
            </div>
          </div>
        </div>

        <!-- Selected Skills Section with individual proficiencies -->
        <div class="selected-skills-section" id="selectedSkillsSection">
          <div class="selected-skills-header">
            <div class="selected-skills-title">
              <span>Selected Skills</span>
              <span class="selected-skills-badge" id="selectedSkillsBadge">0</span>
            </div>
            <button type="button" class="selected-skills-clear-all" id="clearAllSelectedBtn" onclick="clearAllSelectedSkills()" style="display: none;">Clear all</button>
          </div>
          <div class="selected-skills-list" id="selectedSkillsList">
            <div class="selected-skills-empty" id="selectedSkillsEmpty">
              No skills selected yet. Search and select skills from above.
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="addSkillSubmitBtn" onclick="addSkill()" disabled>Add Skills</button>
      </div>
    </div>
  </div>

  <script src="/js/skill-icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script>
    if (!initAuthPage()) throw new Error('Not authenticated');

    let activeTab = 'teach';
    let allSkills = [];
    let mySkillsCache = { teach: [], learn: [] };
    let selectedSkills = [];
    let isSkillsLoading = false;
    let skillsLoadError = false;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    async function render() {
      document.getElementById('app').innerHTML = renderAuthenticatedLayout('My Skills', 'my-skills', `
        <div class="page-header flex-between">
          <div><h1>My Skills</h1><p>Manage the skills you teach and want to learn.</p></div>
          <button class="btn btn-primary" onclick="openAddModal()">➕ Add New Skill</button>
        </div>
        <div class="tabs">
          <button class="tab ${activeTab==='teach'?'active':''}" onclick="switchTab('teach')">Skills I Teach</button>
          <button class="tab ${activeTab==='learn'?'active':''}" onclick="switchTab('learn')">Skills I Want to Learn</button>
        </div>
        <div id="skillsList">${renderSkeletonCards(3)}</div>
      `);
      loadMySkills();
    }

    function switchTab(tab) {
      activeTab = tab;
      render();
    }

    async function loadMySkills() {
      try {
        const data = await api.get(`/user-skills?type=${activeTab}`);
        const currentSkills = data.skills || [];
        mySkillsCache[activeTab] = currentSkills;

        const el = document.getElementById('skillsList');
        if (!currentSkills || currentSkills.length === 0) {
          el.innerHTML = renderEmptyState(
            activeTab === 'teach' ? '👨‍🏫' : '📚',
            `No ${activeTab === 'teach' ? 'Teaching' : 'Learning'} Skills Yet`,
            `Add skills you ${activeTab === 'teach' ? 'can teach' : 'want to learn'} to get started.`,
            'Add Skills',
            'javascript:openAddModal()'
          );
          return;
        }

        el.innerHTML = `<div class="my-skills-list">${currentSkills.map(s => `
          <div class="my-skill-item animate-fade-in">
            <div class="skill-icon-sm">${SkillIcons.getIcon(s.skillName, 28, '', s.skillId?.iconType, s.skillId?.iconKey)}</div>
            <div class="skill-details">
              <h4>${escapeHtml(s.skillName)}</h4>
              <p>${escapeHtml(s.skillId?.category || 'Skill')} • ${escapeHtml(s.level)}</p>
            </div>
            <span class="badge ${s.isVerified ? 'badge-completed' : 'badge-pending'}">${s.isVerified ? '✓ Verified' : 'Unverified'}</span>
            <div class="skill-actions">
              <select class="form-select" style="width:auto;padding:6px 30px 6px 10px;font-size:12px;" onchange="updateLevel('${s._id}',this.value)">
                ${['Beginner','Intermediate','Advanced','Expert'].map(l => `<option value="${l}" ${s.level===l?'selected':''}>${l}</option>`).join('')}
              </select>
              <button class="btn btn-sm btn-danger" onclick="removeSkill('${s._id}')">Remove</button>
            </div>
          </div>
        `).join('')}</div>`;
      } catch (e) {
        Toast.error('Failed to load skills');
      }
    }

    // ----------------------------------------------------
    // Searchable Skill Selector Logic
    // ----------------------------------------------------
    async function loadCatalogueSkills() {
      if (allSkills.length > 0) return;
      isSkillsLoading = true;
      skillsLoadError = false;
      renderDropdownStatus('Loading skills...');

      try {
        const data = await api.get('/skills');
        allSkills = data.skills || [];
        isSkillsLoading = false;
        if (allSkills.length === 0) {
          renderDropdownStatus('No skills available.');
        } else {
          renderSkillDropdown(document.getElementById('skillSearchInput').value);
        }
      } catch (e) {
        isSkillsLoading = false;
        skillsLoadError = true;
        renderDropdownStatus('Unable to load skills. Please try again.', true);
      }
    }

    function renderDropdownStatus(message, isError = false) {
      const menu = document.getElementById('skillDropdownMenu');
      if (!menu) return;
      menu.innerHTML = `<div class="skill-dropdown-status ${isError ? 'text-danger' : ''}">${escapeHtml(message)}</div>`;
    }

    function renderSkillDropdown(searchQuery = '') {
      const menu = document.getElementById('skillDropdownMenu');
      if (!menu) return;

      if (isSkillsLoading) {
        renderDropdownStatus('Loading skills...');
        return;
      }

      if (skillsLoadError) {
        renderDropdownStatus('Unable to load skills. Please try again.', true);
        return;
      }

      if (!allSkills || allSkills.length === 0) {
        renderDropdownStatus('No skills available.');
        return;
      }

      const q = (searchQuery || '').trim().toLowerCase();

      // Filter skills by name, category, subcategory, aliases, or keywords (case-insensitive)
      const filtered = q
        ? allSkills.filter(s => {
            if (s.name && s.name.toLowerCase().includes(q)) return true;
            if (s.category && s.category.toLowerCase().includes(q)) return true;
            if (s.subcategory && s.subcategory.toLowerCase().includes(q)) return true;
            if (s.aliases && s.aliases.some(a => a.toLowerCase().includes(q))) return true;
            if (s.keywords && s.keywords.some(k => k.toLowerCase().includes(q))) return true;
            return false;
          })
        : allSkills;

      if (filtered.length === 0) {
        renderDropdownStatus('No skills found.');
        return;
      }

      // Performance optimization: render max 50 items to keep DOM instant
      const MAX_DISPLAY = 50;
      let count = 0;
      const groups = {};

      for (const skill of filtered) {
        if (count >= MAX_DISPLAY) break;
        const cat = skill.category || 'Other';
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(skill);
        count++;
      }

      const categories = Object.keys(groups).sort();
      let html = '';

      for (const cat of categories) {
        const skillsInCat = groups[cat];
        html += `
          <div class="skill-dropdown-group">
            <div class="skill-dropdown-group-header">
              <span>${escapeHtml(cat)}</span>
              <span style="font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(0,0,0,0.06);font-weight:600;">${skillsInCat.length}</span>
            </div>
            ${skillsInCat.map(s => {
              const isSelected = selectedSkills.some(sel => sel._id === s._id);
              return `
                <div class="skill-dropdown-item ${isSelected ? 'selected' : ''}" 
                     data-id="${s._id}" 
                     onclick="selectSkill('${s._id}')">
                  <span class="item-icon skill-brand-icon" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex-shrink:0;">${SkillIcons.getIconSvg(s.name, s.iconType, s.iconKey)}</span>
                  <span class="item-name">${escapeHtml(s.name)}</span>
                  ${isSelected ? '<span style="font-size:11px;font-weight:700;color:var(--primary);margin-left:auto;display:inline-flex;align-items:center;gap:3px;"><span style="font-size:13px;">✓</span> Added</span>' : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      if (filtered.length > MAX_DISPLAY) {
        html += `
          <div style="padding:8px 14px;font-size:11.5px;color:var(--text-muted);text-align:center;background:#f8fafc;border-top:1px solid var(--border-light);">
            Showing top 50 of ${filtered.length} matches. Type to refine search.
          </div>
        `;
      }

      menu.innerHTML = html;
    }

    function openSkillDropdown() {
      const container = document.getElementById('skillSearchableSelect');
      if (container) container.classList.add('open');
      if (!allSkills.length && !isSkillsLoading) {
        loadCatalogueSkills();
      } else {
        renderSkillDropdown(document.getElementById('skillSearchInput').value);
      }
    }

    function closeSkillDropdown() {
      const container = document.getElementById('skillSearchableSelect');
      if (container) container.classList.remove('open');
    }

    function toggleSkillDropdown(event) {
      if (event) event.stopPropagation();
      const container = document.getElementById('skillSearchableSelect');
      if (container && container.classList.contains('open')) {
        closeSkillDropdown();
      } else {
        document.getElementById('skillSearchInput').focus();
        openSkillDropdown();
      }
    }

    function handleSkillSearch(value) {
      const clearBtn = document.getElementById('skillClearBtn');
      if (clearBtn) clearBtn.style.display = value ? 'block' : 'none';
      openSkillDropdown();
      renderSkillDropdown(value);
    }

    function clearSearchInput(event) {
      if (event) event.stopPropagation();
      const input = document.getElementById('skillSearchInput');
      input.value = '';
      const clearBtn = document.getElementById('skillClearBtn');
      if (clearBtn) clearBtn.style.display = 'none';
      renderSkillDropdown('');
      input.focus();
    }

    function handleSkillKeyDown(e) {
      if (e.key === 'Escape') {
        closeSkillDropdown();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const firstItem = document.querySelector('.skill-dropdown-item');
        if (firstItem) {
          const id = firstItem.getAttribute('data-id');
          if (id) selectSkill(id);
        }
      }
    }

    // ----------------------------------------------------
    // Multi-Skill Selection & Individual Proficiency Logic
    // ----------------------------------------------------
    function selectSkill(id) {
      const skill = allSkills.find(s => s._id === id);
      if (!skill) return;

      const existingIndex = selectedSkills.findIndex(s => s._id === id);
      if (existingIndex >= 0) {
        // Toggle removal if clicked again
        selectedSkills.splice(existingIndex, 1);
      } else {
        // Add new skill with default 'Beginner' proficiency
        selectedSkills.push({
          _id: skill._id,
          name: skill.name,
          category: skill.category,
          subcategory: skill.subcategory,
          iconType: skill.iconType,
          iconKey: skill.iconKey,
          level: 'Beginner'
        });
      }

      renderSelectedSkills();
      renderSkillDropdown(document.getElementById('skillSearchInput').value);
      document.getElementById('skillSearchInput').focus();
    }

    function removeSelectedSkill(id) {
      selectedSkills = selectedSkills.filter(s => s._id !== id);
      renderSelectedSkills();
      renderSkillDropdown(document.getElementById('skillSearchInput').value);
    }

    function updateSelectedSkillLevel(id, level) {
      const item = selectedSkills.find(s => s._id === id);
      if (item) {
        item.level = level;
      }
    }

    function clearAllSelectedSkills() {
      selectedSkills = [];
      renderSelectedSkills();
      renderSkillDropdown(document.getElementById('skillSearchInput').value);
    }

    function renderSelectedSkills() {
      const count = selectedSkills.length;
      const badge = document.getElementById('selectedSkillsBadge');
      const submitBtn = document.getElementById('addSkillSubmitBtn');
      const clearBtn = document.getElementById('clearAllSelectedBtn');
      const listEl = document.getElementById('selectedSkillsList');

      if (badge) badge.textContent = count;

      if (count === 0) {
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Add Skills';
        }
        if (clearBtn) clearBtn.style.display = 'none';
        if (listEl) {
          listEl.innerHTML = `
            <div class="selected-skills-empty" id="selectedSkillsEmpty">
              No skills selected yet. Search and select skills from above.
            </div>
          `;
        }
        return;
      }

      if (clearBtn) clearBtn.style.display = 'inline-block';
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = count === 1 ? 'Add 1 Skill' : `Add ${count} Skills`;
      }

      if (listEl) {
        listEl.innerHTML = selectedSkills.map(s => `
          <div class="selected-skill-card animate-fade-in" data-id="${s._id}">
            <div class="selected-skill-info">
              <div class="selected-skill-icon-wrap">
                <span class="skill-brand-icon" style="width:20px;height:20px;">${SkillIcons.getIconSvg(s.name, s.iconType, s.iconKey)}</span>
              </div>
              <div class="selected-skill-text">
                <span class="selected-skill-name" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</span>
                <span class="selected-skill-cat">${escapeHtml(s.category || 'Skill')}</span>
              </div>
            </div>
            <div class="selected-skill-actions">
              <select class="form-select selected-skill-level-select" onchange="updateSelectedSkillLevel('${s._id}', this.value)" aria-label="Proficiency for ${escapeHtml(s.name)}">
                <option value="Beginner" ${s.level === 'Beginner' ? 'selected' : ''}>Beginner</option>
                <option value="Intermediate" ${s.level === 'Intermediate' ? 'selected' : ''}>Intermediate</option>
                <option value="Advanced" ${s.level === 'Advanced' ? 'selected' : ''}>Advanced</option>
              </select>
              <button type="button" class="selected-skill-remove-btn" onclick="removeSelectedSkill('${s._id}')" title="Remove ${escapeHtml(s.name)}">✕</button>
            </div>
          </div>
        `).join('');
      }
    }

    function onSkillTypeChange() {
      // Retain selected skills when user switches type
    }

    function openAddModal() {
      const modal = document.getElementById('addSkillModal');
      modal.classList.add('active');

      // Sync type dropdown with active tab
      document.getElementById('skillType').value = activeTab;

      // Reset selection state
      selectedSkills = [];
      const searchInput = document.getElementById('skillSearchInput');
      if (searchInput) searchInput.value = '';
      const clearBtn = document.getElementById('skillClearBtn');
      if (clearBtn) clearBtn.style.display = 'none';

      renderSelectedSkills();
      loadCatalogueSkills();
    }

    function closeModal() {
      document.getElementById('addSkillModal').classList.remove('active');
      closeSkillDropdown();
    }

    async function addSkill() {
      if (!selectedSkills || selectedSkills.length === 0) {
        Toast.warning('Please select at least one skill.');
        document.getElementById('skillSearchInput').focus();
        openSkillDropdown();
        return;
      }

      const type = document.getElementById('skillType').value;
      const submitBtn = document.getElementById('addSkillSubmitBtn');

      submitBtn.disabled = true;
      submitBtn.textContent = `Adding ${selectedSkills.length} Skill${selectedSkills.length > 1 ? 's' : ''}...`;

      try {
        const payload = {
          type,
          skills: selectedSkills.map(s => ({
            skillId: s._id,
            level: s.level || 'Beginner'
          }))
        };

        const res = await api.post('/user-skills/bulk', payload);

        if (res.added && res.added.length > 0) {
          Toast.success(`Added ${res.added.length} skill${res.added.length > 1 ? 's' : ''} successfully!`);
        }
        if (res.skipped && res.skipped.length > 0) {
          const skippedSummary = res.skipped.map(x => x.skill).join(', ');
          Toast.warning(`Skipped existing: ${skippedSummary}`);
        }

        closeModal();
        selectedSkills = [];
        activeTab = type;
        render();
      } catch (e) {
        Toast.error(e.message || 'Failed to add skills');
      } finally {
        submitBtn.disabled = false;
        renderSelectedSkills();
      }
    }

    async function updateLevel(id, level) {
      try {
        await api.put(`/user-skills/${id}`, { level });
        Toast.success('Level updated');
      } catch (e) {
        Toast.error(e.message);
      }
    }

    async function removeSkill(id) {
      if (!confirm('Remove this skill?')) return;
      try {
        await api.delete(`/user-skills/${id}`);
        Toast.success('Skill removed');
        render();
      } catch (e) {
        Toast.error(e.message);
      }
    }

    // Close dropdown on outside click
    document.addEventListener('click', (e) => {
      const container = document.getElementById('skillSearchableSelect');
      if (container && !container.contains(e.target)) {
        closeSkillDropdown();
      }
    });

    render();
  </script>
</body>
</html>
